<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Free QR Code Generator</title>

    <meta
      name="description"
      content="Generate QR Codes easily, quickly, and for free with SYNCROZZ QR."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- SYNCROZZ QR Official Icon Pack -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/favicon.svg"
    />
    <link
      rel="shortcut icon"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/favicon-48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/android-chrome-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="SYNCROZZ QR" />
    <meta name="theme-color" content="#008f69" />
    <meta name="msapplication-TileColor" content="#008f69" />
    <meta
      name="msapplication-TileImage"
      content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/icon/QR/mstile-150x150.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Free QR Code Generator"
    />

    <meta
      property="og:description"
      content="Generate QR Codes easily, quickly, and for free with SYNCROZZ QR."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/OGI/OGI.QRv2.jpg"
    />

    <meta
      property="og:image:alt"
      content="SYNCROZZ QR — Create. Share. Connect."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Free QR Code Generator"
    />

    <meta
      name="twitter:description"
      content="Generate QR Codes easily, quickly, and for free with SYNCROZZ QR."
    />

    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/OGI/OGI.QRv2.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="SYNCROZZ QR — Create. Share. Connect."
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
